<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Management System - Customers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            🏦 Bank Management
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard |
            </a>

            <a href="customer.html">
                Customers |
            </a>

            <a href="transaction.html">
                Transactions
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="container">

        <!-- Page Header -->
        <div class="page-header">

            <div>
                <h1>Customers</h1>
                <p>Manage bank customers</p>
            </div>

            <button id="addCustomerBtn">
                + Add Customer
            </button>

        </div>


        <!-- Search -->
        <div class="search-box">

            <input type="text" id="searchCustomer" placeholder="Search customer...">

        </div>


        <!-- Customer Table -->
        <section class="section">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Account Number</th>
                        <th>Customer Name</th>
                        <th>Account Type</th>
                        <th>Balance</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="customerTable">

                    <!-- Customers will be displayed here -->

                </tbody>

            </table>

        </section>


        <!-- Add Customer Modal -->
        <div id="customerModal" class="modal">

            <div class="modal-content">

                <span id="closeModal" class="close">
                    &times;
                </span>

                <h2>Add Customer</h2>


                <!-- Customer Form -->
                <form id="customerForm">

                    <!-- Account Number -->
                    <label for="accountNumber">
                        Account Number
                    </label>

                    <input type="text" id="accountNumber" placeholder="Enter account number" required>


                    <!-- Customer Name -->
                    <label for="customerName">
                        Customer Name
                    </label>

                    <input type="text" id="customerName" placeholder="Enter customer name" required>


                    <!-- Account Type -->
                    <label for="accountType">
                        Account Type
                    </label>

                    <select id="accountType" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="Savings">
                            Savings
                        </option>

                        <option value="Current">
                            Current
                        </option>

                    </select>


                    <!-- Balance -->
                    <label for="customerBalance">
                        Initial Balance
                    </label>

                    <input type="number" id="customerBalance" placeholder="Enter balance" min="0" required>


                    <!-- Submit -->
                    <button type="submit">
                        Add Customer
                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="customer.js"></script>

</body>

</html>
