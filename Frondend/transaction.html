<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Management System - Transactions</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🏦 Bank Management
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard|
            </a>

            <a href="customer.html">
                Customer|
            </a>

            <a href="transaction.html">
                Transactions
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container">

        <div class="page-header">

            <div>

                <h1>Transactions</h1>

                <p>View all bank transactions</p>

            </div>

            <button id="newTransactionBtn">
                + New Transaction
            </button>

        </div>


        <!-- Search -->

        <div class="search-box">

            <input type="text" id="searchTransaction" placeholder="Search transaction...">

        </div>


        <!-- Transaction Table -->

        <section class="section">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Customer</th>

                        <th>Type</th>

                        <th>Amount</th>

                        <th>Date</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="transactionTable">

                    <!-- Transaction data will come from JavaScript -->

                </tbody>

            </table>

        </section>


        <!-- Transaction Form -->

        <div id="transactionModal" class="modal">

            <div class="modal-content">

                <span id="closeTransactionModal" class="close">
                    &times;
                </span>

                <h2>New Transaction</h2>


                <form id="transactionForm">

                    <label>Customer ID</label>

                    <input type="number" id="transactionCustomerId" placeholder="Enter customer ID" required>


                    <label>Transaction Type</label>

                    <select id="transactionType" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="DEPOSIT">
                            Deposit
                        </option>

                        <option value="WITHDRAW">
                            Withdraw
                        </option>

                    </select>


                    <label>Amount</label>

                    <input type="number" id="transactionAmount" placeholder="Enter amount" required>


                    <button type="submit">
                        Submit Transaction
                    </button>

                </form>

            </div>

        </div>

    </main>


    <script src="transaction.js"></script>

</body>

</html>
